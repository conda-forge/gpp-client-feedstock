{% set name = "gpp-client" %}
{% set version = "26.10.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/dd/f7/d5d38ba1e0b7af91443eaecc1f6fde585070b5958d917d2d2d9f8a20f059/gpp_client-{{ version }}.tar.gz
  sha256: 73e54b08b552e769e9422b7d9cd9578def05e7a9b9e18231afbb75aaf0bb37ea

build:
  entry_points:
    - gpp = gpp_client.cli.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - aiohttp >=3.13.4
    - beautifulsoup4 >=4.11.0
    - graphql-core >=3.2.0
    - httpx >=0.23
    - pydantic >=2.12.0
    - toml >=0.10
    - typer >=0.21.1
    - websockets >=14.2
    - pydantic-settings >=2.13.1
    - click >=8.3.1

test:
  imports:
    - gpp_client
  commands:
    - pip check
    - gpp --help
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Gemini Program Platform client.
  dev_url: https://github.com/gemini-hlsw/gpp-client
  doc_url: https://gpp-client.readthedocs.io/en/latest/
  home: https://github.com/gemini-hlsw/gpp-client
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - miguelgomezgomez
    - davner
